<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>암송 카드</title>
  <meta name="description" content="5확신부터 100구절·180구절·60구절 시리즈까지, 성경 암송 카드. 터치할 때마다 한 단어씩 보여줘요.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="암송 카드">
  <meta property="og:description" content="5확신부터 100구절·180구절·60구절 시리즈까지, 성경 암송 카드. 터치할 때마다 한 단어씩 보여줘요.">
  <meta property="og:image" content="https://goldentianny.github.io/Test/assets/thumbnail.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://goldentianny.github.io/Test/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="암송 카드">
  <meta name="theme-color" content="#ffffff">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #fff;
      color: #222;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      user-select: none;
    }

    /* 상단: 대주제 > 소주제 */
    .top {
      padding: 14px 16px 10px;
      border-bottom: 2px solid #333;
    }
    .top .major {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #333;
      padding: 1px 7px;
      margin-bottom: 6px;
    }
    .top .minor {
      font-size: 17px;
      font-weight: 700;
    }
    .top .minor-en {
      font-size: 12px;
      color: #666;
      font-weight: 400;
      margin-left: 4px;
    }

    /* 카드 본문 */
    .card {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 16px;
      cursor: pointer;
    }
    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: #e6e6e6;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      padding: 7px 10px;
      margin: 14px 0 12px;
    }
    .sub-bar { font-size: 12px; color: #666; margin: 12px 0 -8px; padding: 0 2px; }
    .title-bar .name { font-size: 15px; font-weight: 700; }
    .title-bar .name.hidden-title { color: #999; letter-spacing: 2px; }
    .title-bar .ref  { font-size: 13px; font-weight: 700; }

    .lines {
      flex: 1;
      font-size: 18px;
      line-height: 2;
      padding: 0 4px;
      word-break: keep-all;
    }
    .word {
      display: inline-block;
      margin-right: .35em;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .word.show { opacity: 1; transform: none; }

    .hint {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      padding: 10px 0 4px;
    }
    .hint.hidden { visibility: hidden; }

    /* 하단 컨트롤 */
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 20px;
      border-top: 1px solid #ccc;
    }
    .nav {
      width: 46px; height: 46px;
      border: 1px solid #333;
      border-radius: 50%;
      background: #fff;
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .nav:disabled { opacity: .25; cursor: default; }
    .counter { font-size: 13px; color: #666; }
    .reveal {
      border: 1px solid #333;
      background: #fff;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
    }
    .reveal:active, .nav:active { background: #eee; }
    .right { display: flex; align-items: center; gap: 10px; }

    .app { flex: 1; display: flex; flex-direction: column; }
    .top-row { display: flex; justify-content: space-between; align-items: center; }
    .home {
      border: 1px solid #333;
      background: #fff;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .home:active { background: #eee; }
    .top-btns { display: flex; gap: 6px; }
    .top-left { display: flex; align-items: center; gap: 6px; }
    #addToWallet.in { background: #333; color: #fff; }

    /* 아래에서 올라오는 선택창 */
    .sheet-bg {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.35); z-index: 10;
      align-items: flex-end;
    }
    .sheet-bg.open { display: flex; }
    .sheet {
      width: 100%; background: #fff;
      border-top: 2px solid #333;
      padding: 16px 16px 28px;
    }
    .sheet-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
    .sheet-row {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; background: #fff; border: 1px solid #333;
      padding: 12px 14px; margin-bottom: 8px;
      font-family: inherit; font-size: 15px; color: #222; cursor: pointer; text-align: left;
    }
    .sheet-row:active { background: #eee; }
    .sheet-row:disabled { opacity: .4; cursor: default; }
    .sheet-row.current { background: #333; color: #fff; }
    .sheet-row small { font-size: 12px; color: inherit; opacity: .7; }
    .sheet-cancel { width: 100%; margin-top: 4px; }

    /* 시작 메뉴 */
    .menu {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 24px 20px 40px;
      overflow-y: auto;
    }
    .menu-group {
      display: flex; align-items: center; gap: 10px;
      width: 100%;
      margin-top: 10px;
      padding: 10px 2px;
      background: none;
      border: none;
      border-bottom: 2px solid #333;
      font-family: inherit;
      color: #222;
      cursor: pointer;
      text-align: left;
    }
    .menu-group .menu-count { flex: 1; }
    .menu-arrow { font-size: 16px; color: #555; transition: transform .2s; }
    .menu-group.open .menu-arrow { transform: rotate(180deg); }
    .menu-sub { display: none; flex-direction: column; gap: 8px; padding-top: 8px; }
    .menu-sub.open { display: flex; }
    .menu-head { display: flex; justify-content: space-between; align-items: flex-start; }
    .menu-title { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
    .menu-subtitle { font-size: 13px; color: #777; margin: 6px 0 16px; }
    .menu-list { display: flex; flex-direction: column; gap: 8px; }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid #333;
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      color: #222;
    }
    .menu-item:active { background: #eee; }
    .menu-major { font-size: 14px; font-weight: 700; border: 1px solid #333; padding: 2px 9px; }
    .menu-minor { font-size: 16px; font-weight: 700; }
    .menu-minor small { font-size: 12px; color: #666; font-weight: 400; }
    .menu-count { font-size: 12px; color: #777; white-space: nowrap; }
    .kakao {
      display: flex; align-items: center; justify-content: center;
      width: 42px; height: 42px;
      flex-shrink: 0;
      background: #FEE500;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }
    .kakao:active { background: #f2d900; }
    .share-msg { text-align: right; font-size: 12px; color: #777; min-height: 16px; margin-bottom: 4px; }

    /* 암송지갑 버튼 (첫 화면 최상단) */
    .wallet-btn {
      display: flex; align-items: center; gap: 12px;
      width: 100%;
      background: #fff;
      border: 2px solid #333;
      padding: 12px 14px;
      margin-bottom: 6px;
      font-family: inherit;
      color: #222;
      text-align: left;
      cursor: pointer;
    }
    .wallet-btn:active { background: #eee; }
    .wallet-icon { font-size: 26px; }
    .wallet-text { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .wallet-text b { font-size: 17px; }
    .wallet-text small { font-size: 12px; color: #777; }

    /* 공통 화면 틀 */
    .screen { flex: 1; display: none; flex-direction: column; min-height: 0; }
    .screen.open { display: flex; }
    .screen-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 2px solid #333;
    }
    .screen-head .home { margin: 0; min-width: 48px; }
    .screen-title { font-size: 17px; font-weight: 700; }
    .screen-spacer { min-width: 48px; }
    .screen-body { flex: 1; overflow-y: auto; padding: 12px 16px 40px; }

    /* 지갑 칸 */
    .slot { margin-bottom: 22px; }
    .slot-head {
      display: flex; align-items: center; gap: 8px;
      background: #e6e6e6;
      border-top: 1px solid #333; border-bottom: 1px solid #333;
      padding: 8px 10px;
    }
    .slot-name { font-size: 15px; font-weight: 700; flex: 1; }
    .slot-count { font-size: 13px; color: #555; }
    .slot-count.full { color: #c00; font-weight: 700; }
    .slot-add {
      width: 30px; height: 30px; margin-left: 4px;
      border: 1px solid #333; border-radius: 50%; background: #fff;
      font-size: 20px; line-height: 1; color: #222; cursor: pointer;
      display: flex; align-items: center; justify-content: center; padding: 0 0 2px;
    }
    .slot-add:active { background: #333; color: #fff; }
    .slot-add:disabled { opacity: .3; cursor: default; }
    .btn {
      border: 1px solid #333; background: #fff; color: #222;
      padding: 8px 14px; font-size: 13px; font-weight: 700; border-radius: 4px;
      font-family: inherit; cursor: pointer;
    }
    .btn:active { background: #eee; }
    .btn:disabled { opacity: .35; cursor: default; }
    .btn.primary { background: #333; color: #fff; }
    .btn.primary:active { background: #000; }
    .empty { font-size: 13px; color: #999; padding: 10px 4px; }

    .vrow {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 4px;
      border-bottom: 1px dashed #ccc;
      font-size: 14px;
    }
    .vrow .vref { font-weight: 700; white-space: nowrap; }
    .vrow .vname { flex: 1; color: #222; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .vrow .vpath { color: #888; }
    .vrow .vfrom { font-size: 11px; color: #999; white-space: nowrap; }
    .icon-btn {
      width: 32px; height: 32px; border: 1px solid #999; border-radius: 50%;
      background: #fff; font-size: 14px; cursor: pointer; flex-shrink: 0; color: #333;
    }
    .icon-btn:active { background: #eee; }
    .icon-btn:disabled { opacity: .25; cursor: default; }
    .icon-btn.wide { width: auto; padding: 0 10px; border-radius: 16px; font-size: 12px; font-weight: 700; }
    .vrow.draggable {
      cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      background: #fff; position: relative; overflow: hidden; padding: 0; gap: 0;
      display: block;
    }
    .vrow-inner {
      display: flex; align-items: center; gap: 8px; cursor: pointer;
      padding: 12px 4px; background: #fff; position: relative; z-index: 1; width: 100%; box-sizing: border-box;
      transition: transform .18s ease;
    }
    .vrow-actions {
      position: absolute; top: 0; right: 0; bottom: 0; width: 132px;
      display: flex;
    }
    .act {
      flex: 1; border: none; color: #fff; font-size: 14px; font-weight: 700;
      font-family: inherit; cursor: pointer;
    }
    .act.move { background: #666; }
    .act.del { background: #d33; }
    .act:active { filter: brightness(.85); }
    .vrow.lifted {
      background: #fffbe6;
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
      border: 1px solid #333;
      border-radius: 6px;
      transform: scale(1.02);
      z-index: 2;
    }
    .vrow.lifted .vrow-inner { background: transparent; }
    .slot-rows { min-height: 20px; }
    .drag-tip { font-size: 12px; color: #999; text-align: center; padding: 4px 0 10px; }
    .vrow { gap: 5px; }
    .vrow .vfrom { display: none; }

    /* 구절 고르기 */
    .picker-slot { padding: 8px 16px; font-size: 13px; color: #555; border-bottom: 1px solid #ccc; background: #fafafa; }
    .picker-slot b { color: #222; }
    .pick-btn { min-width: 60px; }
    .pick-btn.in { background: #333; color: #fff; }
    .pick-btn.other { border-color: #bbb; color: #999; }
  </style>
</head>
<body>

  <div class="menu" id="menu">
    <div class="menu-head">
      <div>
        <div class="menu-title">SCRIPTURE MEMORY</div>
        <div class="menu-subtitle">암송할 묶음을 고르세요</div>
      </div>
      <button class="kakao" id="kakaoShare" aria-label="카카오톡으로 공유">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="#191919" d="M12 3C6.5 3 2 6.6 2 11c0 2.8 1.9 5.3 4.7 6.7l-1 3.7c-.1.3.3.6.6.4l4.3-2.9c.5.1.9.1 1.4.1 5.5 0 10-3.6 10-8S17.5 3 12 3z"/></svg>
      </button>
    </div>
    <div class="share-msg" id="shareMsg"></div>
    <button class="wallet-btn" id="openWallet">
      <span class="wallet-icon">👛</span>
      <span class="wallet-text"><b>암송지갑</b><small id="walletSummary">이번주 새 구절 · 복습 1 · 복습 2</small></span>
      <span class="menu-arrow">▸</span>
    </button>
    <div class="menu-list" id="menuList"></div>
  </div>

  <!-- 암송지갑 -->
  <div class="screen" id="wallet">
    <div class="screen-head">
      <button class="home" id="walletBack">목록</button>
      <div class="screen-title">암송지갑</div>
      <span class="screen-spacer"></span>
    </div>
    <div class="drag-tip">구절을 길게 누른 채 끌면 순서와 칸을 바꿀 수 있어요</div>
    <div class="screen-body" id="walletBody"></div>
  </div>

  <!-- 구절 고르기 -->
  <div class="screen" id="picker">
    <div class="screen-head">
      <button class="home" id="pickerBack">뒤로</button>
      <div class="screen-title" id="pickerTitle">구절 고르기</div>
      <button class="home" id="pickerDone">완료</button>
    </div>
    <div class="picker-slot" id="pickerSlot"></div>
    <div class="screen-body" id="pickerBody"></div>
  </div>

  <div class="app" id="app">
  <div class="top">
    <div class="top-row">
      <div class="top-left">
        <div class="major" id="major"></div>
      </div>
      <div class="top-btns">
        <button class="home" id="addToWallet">👛 넣기</button>
        <button class="home" id="goWallet">지갑</button>
        <button class="home" id="home">목록</button>
      </div>
    </div>
    <div class="minor"><span id="minor"></span><span class="minor-en" id="minorEn"></span></div>
  </div>

  <div class="card" id="card">
    <div class="sub-bar" id="sub"></div>
    <div class="title-bar">
      <span class="name" id="name"></span>
      <span class="ref" id="ref"></span>
    </div>
    <div class="lines" id="lines"></div>
    <div class="hint" id="hint">화면을 터치하면 한 단어씩 보여요</div>
  </div>

  <div class="bottom">
    <button class="nav" id="prev" aria-label="이전">◀</button>
    <span class="counter" id="counter"></span>
    <div class="right">
      <button class="reveal" id="revealAll">모두 확인</button>
      <button class="nav" id="next" aria-label="다음">▶</button>
    </div>
  </div>
  </div>

  <!-- 지갑에 넣기 선택창 -->
  <div class="sheet-bg" id="sheetBg">
    <div class="sheet" id="sheet">
      <div class="sheet-title" id="sheetTitle">어느 칸에 넣을까요?</div>
      <div id="sheetList"></div>
      <button class="btn sheet-cancel" id="sheetCancel">닫기</button>
    </div>
  </div>

  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"
          integrity="sha384-DKYJZ8NLiK8MN4/C5P2dtSmLQ4KwPaoqAfyA/DfmEc1VDxu4yyC7wy6K1Hs90nka"
          crossorigin="anonymous"></script>
  <script src="data.js"></script>
  <script>
    // 카카오 개발자 사이트(developers.kakao.com)에서 받은 JavaScript 키를 넣으면
    // 카카오톡 전용 공유창이 열려요. 비워두면 휴대폰 기본 공유창을 사용해요.
    const KAKAO_JS_KEY = "";
    const SITE_URL = "https://goldentianny.github.io/Test/";
    const SITE_TITLE = "암송 카드";
    const SITE_DESC = "5확신부터 100구절·180구절·60구절 시리즈까지, 성경 암송 카드. 터치할 때마다 한 단어씩 보여줘요.";
    const SITE_IMAGE = SITE_URL + "assets/thumbnail.png";



    const $ = id => document.getElementById(id);
    const words = v => v.text.split(/\s+/);
    SETS.forEach((set, si) => set.verses.forEach((v, vi) => { v.id = si + ":" + vi; }));

    // ---------- 화면 전환 ----------
    const SCREENS = ["menu", "wallet", "picker", "app"];
    function show(id) {
      SCREENS.forEach(k => {
        const el = $(k);
        if (k === "menu" || k === "app") el.style.display = (k === id) ? "flex" : "none";
        else el.classList.toggle("open", k === id);
      });
    }
    function showMenu() { updateWalletSummary(); show("menu"); }

    // ---------- 카드 (덱 단위로 동작) ----------
    let deck = null;        // { major, minor, minorEn, verses, from }
    let index = 0;
    let shown = 0;          // 보여준 단어 수
    let titleShown = false; // 소제목(주제)을 보여줬는지

    function openDeck(d, start) {
      deck = d;
      index = start || 0;
      shown = 0;
      titleShown = false;
      $("home").textContent = "목록";
      show("app");
      render();
    }
    function openSet(i, start) {
      const set = SETS[i];
      openDeck({ major: set.major, minor: set.minor, minorEn: set.minorEn, verses: set.verses, from: "menu", setIndex: i }, start);
    }

    function render() {
      const v = deck.verses[index];
      const set = v.slotName ? setById(v.id) : null;
      $("major").textContent = set ? set.major : deck.major;
      $("minor").textContent = set ? set.minor : deck.minor;
      const en = set ? set.minorEn : deck.minorEn;
      $("minorEn").textContent = en ? "(" + en + ")" : "";

      $("name").textContent = titleShown ? v.name : "· · ·";
      $("name").classList.toggle("hidden-title", !titleShown);
      $("sub").textContent = v.sub || "";
      $("sub").style.display = (v.sub && titleShown) ? "" : "none";
      $("ref").textContent = v.ref;
      $("counter").textContent = (index + 1) + " / " + deck.verses.length;

      const box = $("lines");
      box.innerHTML = "";
      words(v).slice(0, shown).forEach(w => {
        const span = document.createElement("span");
        span.className = "word show";
        span.textContent = w;
        box.appendChild(span);
      });

      const where = slotOf(v.id);
      $("addToWallet").textContent = where >= 0 ? "👛 " + wallet.slots[where].name : "👛 넣기";
      $("addToWallet").classList.toggle("in", where >= 0);

      $("hint").textContent = titleShown ? "화면을 터치하면 한 단어씩 보여요" : "화면을 터치하면 소제목이 보여요";
      $("hint").classList.toggle("hidden", shown > 0);
      const linked = deck.setIndex !== undefined;
      $("prev").disabled = index === 0 && !(linked && deck.setIndex > 0);
      $("next").disabled = index === deck.verses.length - 1 && !(linked && deck.setIndex < SETS.length - 1);
      $("revealAll").disabled = shown >= words(v).length;
    }

    function showNextWord() {
      if (!titleShown) {
        titleShown = true;
        render();
        return;
      }
      if (shown < words(deck.verses[index]).length) {
        shown++;
        render();
      }
    }

    function go(delta) {
      const n = index + delta;
      if (n < 0 || n >= deck.verses.length) {
        // 묶음 끝에서는 다음/이전 묶음으로 이어서 넘어가요 (목록에서 연 경우)
        if (deck.setIndex === undefined) return;
        const si = deck.setIndex + delta;
        if (si < 0 || si >= SETS.length) return;
        openSet(si, delta > 0 ? 0 : SETS[si].verses.length - 1);
        return;
      }
      index = n;
      shown = 0;
      titleShown = false;
      render();
    }

    // ---------- 암송지갑 (휴대폰 안에 저장, 가입 필요 없음) ----------
    const WALLET_KEY = "wallet.v1";
    const DEFAULT_SLOTS = [
      { name: "이번주 새 구절", cap: 2,  ids: [] },
      { name: "복습 1",        cap: 12, ids: [] },
      { name: "복습 2",        cap: 12, ids: [] }
    ];
    let wallet = loadWallet();

    function loadWallet() {
      try {
        const raw = localStorage.getItem(WALLET_KEY);
        if (raw) {
          const w = JSON.parse(raw);
          if (w && Array.isArray(w.slots) && w.slots.length === 3) {
            // 데이터가 바뀌어 사라진 구절은 걸러내요
            w.slots.forEach((sl, k) => {
              sl.name = DEFAULT_SLOTS[k].name;
              sl.cap = DEFAULT_SLOTS[k].cap;
              sl.ids = (sl.ids || []).filter(id => !!verseById(id));
            });
            return w;
          }
        }
      } catch (e) { /* 저장소를 못 쓰는 환경 */ }
      return { slots: DEFAULT_SLOTS.map(s => ({ ...s, ids: [] })) };
    }
    function saveWallet() {
      try { localStorage.setItem(WALLET_KEY, JSON.stringify(wallet)); } catch (e) { /* 무시 */ }
    }
    function verseById(id) {
      const [si, vi] = id.split(":").map(Number);
      const set = SETS[si];
      return set && set.verses[vi] ? set.verses[vi] : null;
    }
    function setById(id) { return SETS[Number(id.split(":")[0])]; }
    function slotOf(id) { return wallet.slots.findIndex(sl => sl.ids.includes(id)); }
    // "60구절 › A › 소제목" 처럼 분류 경로를 만들어요
    const shortLabel = t => { const m = (t || "").match(/^\(?([A-Za-z0-9\-]+|[IVX]+)\)?[\.\)]?\s/); return m ? m[1] : ""; };
    function pathOf(id) {
      const set = setById(id), v = verseById(id);
      const parts = [set.major];
      const sameMajor = SETS.filter(x => x.major === set.major).length > 1;
      if (sameMajor) parts.push(shortLabel(set.minor) || set.minor);
      const subShort = shortLabel(v.sub);
      if (subShort) parts.push(subShort);
      return parts;
    }
    function removeFromWallet(id) {
      wallet.slots.forEach(sl => { sl.ids = sl.ids.filter(x => x !== id); });
    }
    function addToSlot(k, id) {
      const sl = wallet.slots[k];
      if (sl.ids.length >= sl.cap) return false;
      removeFromWallet(id);
      sl.ids.push(id);
      saveWallet();
      return true;
    }
    function updateWalletSummary() {
      $("walletSummary").textContent = wallet.slots.map(sl => sl.name + " " + sl.ids.length + "/" + sl.cap).join(" · ");
    }

    function renderWallet() {
      swipe.open = null;
      const body = $("walletBody");
      body.innerHTML = "";
      wallet.slots.forEach((sl, k) => {
        const box = document.createElement("div");
        box.className = "slot";
        const full = sl.ids.length >= sl.cap;
        box.innerHTML =
          '<div class="slot-head"><span class="slot-name">' + sl.name + '</span>' +
          '<span class="slot-count' + (full ? ' full' : '') + '">' + sl.ids.length + ' / ' + sl.cap + '</span></div>';
        const add = document.createElement("button");
        add.className = "slot-add";
        add.textContent = "+";
        add.title = "구절 추가";
        add.disabled = full;
        add.addEventListener("click", () => openPicker(k));
        box.querySelector(".slot-head").appendChild(add);

        const rows = document.createElement("div");
        rows.className = "slot-rows";
        rows.dataset.slot = k;
        if (sl.ids.length === 0) {
          const e = document.createElement("div");
          e.className = "empty";
          e.textContent = "아직 비어 있어요. 오른쪽 + 로 담거나, 구절을 길게 눌러 끌어다 놓으세요.";
          rows.appendChild(e);
        }
        sl.ids.forEach(id => {
          const v = verseById(id), set = setById(id);
          const row = document.createElement("div");
          row.className = "vrow draggable";
          row.dataset.id = id;
          row.innerHTML =
            '<div class="vrow-inner"><span class="vref">' + v.ref + '</span>' +
            '<span class="vname"><span class="vpath">' + pathOf(id).join(" › ") + ' › </span>' +
            v.name.replace(/^\d+\. /, "") + '</span></div>' +
            '<div class="vrow-actions"></div>';
          const acts = row.querySelector(".vrow-actions");
          const mv = document.createElement("button");
          mv.className = "act move"; mv.textContent = "이동";
          mv.addEventListener("click", () => { closeSwipe(); openSheet(id, renderWallet); });
          const del = document.createElement("button");
          del.className = "act del"; del.textContent = "삭제";
          del.addEventListener("click", () => { removeFromWallet(id); saveWallet(); renderWallet(); });
          acts.appendChild(mv);
          acts.appendChild(del);
          rows.appendChild(row);
        });
        box.appendChild(rows);
        body.appendChild(box);
      });
    }
    function openWallet() { renderWallet(); show("wallet"); }

    // 지갑 전체(새 구절 → 복습 1 → 복습 2)를 한 덱으로 이어서 암송해요
    function openWalletDeck(startId) {
      const verses = [];
      wallet.slots.forEach(sl => sl.ids.forEach(id => verses.push({ ...verseById(id), slotName: sl.name })));
      if (!verses.length) return;
      const start = Math.max(0, verses.findIndex(v => v.id === startId));
      openDeck({ major: "암송지갑", minor: "", minorEn: "", from: "wallet", verses }, start);
    }

    // ---------- 길게 눌러 끌어서 순서 바꾸기 ----------
    const drag = { timer: null, row: null, active: false, startX: 0, startY: 0, hint: null };
    const HOLD_MS = 350;
    const swipe = { row: null, dx: 0, mode: null, open: null };   // mode: null | "h"(가로) | "v"(세로)
    const SWIPE_W = 132;

    function closeSwipe() {
      if (swipe.open) { swipe.open.classList.remove("open"); swipe.open.querySelector(".vrow-inner").style.transform = ""; }
      swipe.open = null;
    }

    function pointOf(e) {
      const t = e.touches ? e.touches[0] || e.changedTouches[0] : e;
      return { x: t.clientX, y: t.clientY };
    }
    function dragStart(e) {
      const row = e.target.closest(".vrow.draggable");
      if (swipe.open && swipe.open !== row) closeSwipe();
      if (!row || e.target.closest("button")) return;
      const pt = pointOf(e);
      swipe.row = row; swipe.dx = 0; swipe.mode = null;
      drag.row = row; drag.startX = pt.x; drag.startY = pt.y; drag.active = false;
      clearTimeout(drag.timer);
      drag.timer = setTimeout(() => {
        closeSwipe();
        row.querySelector(".vrow-inner").style.transform = "";
        drag.active = true;
        row.classList.add("lifted");
        if (navigator.vibrate) navigator.vibrate(15);
      }, HOLD_MS);
    }
    function dragMove(e) {
      if (!drag.row) return;
      const pt = pointOf(e);
      if (!drag.active) {
        const dx = pt.x - drag.startX, dy = pt.y - drag.startY;
        // 길게 누르기 전에 움직이면: 가로면 밀어서 열기, 세로면 그냥 스크롤
        if (swipe.mode === null && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
          swipe.mode = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
          clearTimeout(drag.timer);
        }
        if (swipe.mode === "h" && swipe.row) {
          e.preventDefault();
          const base = swipe.open === swipe.row ? -SWIPE_W : 0;
          swipe.dx = Math.max(-SWIPE_W, Math.min(0, base + dx));
          swipe.row.querySelector(".vrow-inner").style.transform = "translateX(" + swipe.dx + "px)";
        }
        return;
      }
      e.preventDefault();
      const el = document.elementFromPoint(pt.x, pt.y);
      if (!el) return;
      const over = el.closest(".vrow.draggable");
      const rows = el.closest(".slot-rows");
      if (over && over !== drag.row) {
        const r = over.getBoundingClientRect();
        const before = pt.y < r.top + r.height / 2;
        over.parentNode.insertBefore(drag.row, before ? over : over.nextSibling);
      } else if (rows && !rows.contains(drag.row)) {
        rows.appendChild(drag.row);   // 빈 칸이나 칸 끝에 놓기
      }
      // 자동 스크롤 (화면 위/아래 가장자리)
      const body = $("walletBody"), b = body.getBoundingClientRect();
      if (pt.y < b.top + 50) body.scrollTop -= 8;
      else if (pt.y > b.bottom - 50) body.scrollTop += 8;
    }
    function dragEnd() {
      clearTimeout(drag.timer);
      if (drag.active && drag.row) { drag.justMoved = true; commitDragOrder(); }
      else if (swipe.mode === "h" && swipe.row) {
        drag.justMoved = true;
        const row = swipe.row;
        if (swipe.dx < -SWIPE_W / 3) {
          if (swipe.open && swipe.open !== row) closeSwipe();
          row.classList.add("open");
          row.querySelector(".vrow-inner").style.transform = "translateX(-" + SWIPE_W + "px)";
          swipe.open = row;
        } else {
          row.classList.remove("open");
          row.querySelector(".vrow-inner").style.transform = "";
          if (swipe.open === row) swipe.open = null;
        }
      }
      swipe.row = null; swipe.mode = null;
      dragCancel();
    }
    function dragCancel() {
      clearTimeout(drag.timer);
      swipe.row = null; swipe.mode = null;
      if (drag.row) drag.row.classList.remove("lifted");
      drag.row = null; drag.active = false;
      setTimeout(() => { drag.justMoved = false; }, 300);
    }
    function commitDragOrder() {
      const next = wallet.slots.map(sl => ({ ...sl, ids: [] }));
      document.querySelectorAll("#walletBody .slot-rows").forEach(rows => {
        const k = Number(rows.dataset.slot);
        next[k].ids = [...rows.querySelectorAll(".vrow.draggable")].map(r => r.dataset.id);
      });
      const over = next.find(sl => sl.ids.length > sl.cap);
      if (over) {
        alert("「" + over.name + "」 칸이 가득 차서 옮길 수 없어요.");
      } else {
        wallet.slots = next;
        saveWallet();
      }
      renderWallet();
    }
    const wb = $("walletBody");
    wb.addEventListener("touchstart", dragStart, { passive: true });
    wb.addEventListener("touchmove", dragMove, { passive: false });
    wb.addEventListener("touchend", dragEnd);
    wb.addEventListener("touchcancel", dragCancel);
    wb.addEventListener("mousedown", dragStart);
    document.addEventListener("mousemove", dragMove);
    document.addEventListener("mouseup", dragEnd);
    wb.addEventListener("contextmenu", e => { if (drag.row) e.preventDefault(); });
    wb.addEventListener("click", e => {
      const row = e.target.closest(".vrow.draggable");
      if (swipe.open && (!row || row !== swipe.open || !e.target.closest(".vrow-actions"))) { closeSwipe(); return; }
      if (drag.justMoved) { drag.justMoved = false; return; }
      if (row && e.target.closest(".vrow-inner")) openWalletDeck(row.dataset.id);
    });

    // ---------- 구절 고르기 ----------
    let pickSlot = 0;
    let pickSet = null;   // null이면 묶음 목록, 숫자면 그 묶음의 구절 목록

    function openPicker(k) { pickSlot = k; pickSet = null; renderPicker(); show("picker"); }

    function renderPicker() {
      const sl = wallet.slots[pickSlot];
      $("pickerSlot").innerHTML = '<b>' + sl.name + '</b>에 담는 중 · ' + sl.ids.length + ' / ' + sl.cap;
      const body = $("pickerBody");
      body.innerHTML = "";
      $("pickerBack").textContent = pickSet === null ? "지갑" : "뒤로";

      if (pickSet === null) {
        $("pickerTitle").textContent = "묶음 고르기";
        let lastMajor = null;
        SETS.forEach((set, i) => {
          if (set.major !== lastMajor) {
            const h = document.createElement("div");
            h.className = "menu-group";
            h.style.cursor = "default";
            h.innerHTML = '<span class="menu-major">' + set.major + '</span>';
            body.appendChild(h);
            lastMajor = set.major;
          }
          const inThis = set.verses.filter((_, vi) => sl.ids.includes(i + ":" + vi)).length;
          const btn = document.createElement("button");
          btn.className = "menu-item";
          btn.style.marginTop = "8px";
          btn.innerHTML = '<span class="menu-minor">' + set.minor + '</span>' +
                          '<span class="menu-count">' + (inThis ? inThis + '개 담김 · ' : '') + set.verses.length + '구절</span>';
          btn.addEventListener("click", () => { pickSet = i; renderPicker(); });
          body.appendChild(btn);
        });
      } else {
        const set = SETS[pickSet];
        $("pickerTitle").textContent = set.minor;
        set.verses.forEach((v, vi) => {
          const id = pickSet + ":" + vi;
          const where = slotOf(id);
          const row = document.createElement("div");
          row.className = "vrow";
          row.innerHTML = '<span class="vref">' + v.ref + '</span>' +
                          '<span class="vname">' + v.name.replace(/^\d+\. /, "") + '</span>';
          const b = document.createElement("button");
          b.className = "btn pick-btn";
          if (where === pickSlot) {
            b.textContent = "담김 ✓"; b.classList.add("in");
            b.addEventListener("click", () => { removeFromWallet(id); saveWallet(); renderPicker(); });
          } else if (where >= 0) {
            b.textContent = wallet.slots[where].name; b.classList.add("other");
            b.title = "이미 다른 칸에 있어요. 누르면 이 칸으로 옮겨요.";
            b.addEventListener("click", () => { if (!addToSlot(pickSlot, id)) alert("이 칸이 가득 찼어요."); renderPicker(); });
          } else {
            b.textContent = "담기";
            b.disabled = sl.ids.length >= sl.cap;
            b.addEventListener("click", () => { addToSlot(pickSlot, id); renderPicker(); });
          }
          row.appendChild(b);
          body.appendChild(row);
        });
      }
    }

    // ---------- 카드 화면에서 지갑에 넣기 ----------
    function openSheet(id, onDone) {
      const v = verseById(id);
      const where = slotOf(id);
      $("sheetTitle").textContent = v.ref + " · " + (where >= 0 ? "지금은 「" + wallet.slots[where].name + "」에 있어요" : "어느 칸에 넣을까요?");
      const list = $("sheetList");
      list.innerHTML = "";
      wallet.slots.forEach((sl, k) => {
        const b = document.createElement("button");
        b.className = "sheet-row" + (k === where ? " current" : "");
        const full = sl.ids.length >= sl.cap && k !== where;
        b.innerHTML = '<span>' + sl.name + (k === where ? ' ✓' : '') + '</span><small>' + sl.ids.length + ' / ' + sl.cap + (full ? ' · 가득 참' : '') + '</small>';
        b.disabled = full;
        b.addEventListener("click", () => {
          if (k === where) { removeFromWallet(id); saveWallet(); }
          else addToSlot(k, id);
          closeSheet();
          onDone();
        });
        list.appendChild(b);
      });
      $("sheetBg").classList.add("open");
    }
    function closeSheet() { $("sheetBg").classList.remove("open"); }
    $("addToWallet").addEventListener("click", () => openSheet(deck.verses[index].id, render));
    $("sheetCancel").addEventListener("click", closeSheet);
    $("sheetBg").addEventListener("click", e => { if (e.target === $("sheetBg")) closeSheet(); });

    $("openWallet").addEventListener("click", openWallet);
    $("walletBack").addEventListener("click", showMenu);
    $("pickerBack").addEventListener("click", () => { if (pickSet === null) openWallet(); else { pickSet = null; renderPicker(); } });
    $("pickerDone").addEventListener("click", openWallet);

    // 메뉴 만들기 (대주제를 누르면 소주제 목록이 펼쳐져요)
    const groups = [];
    SETS.forEach((set, i) => {
      let g = groups.find(g => g.major === set.major);
      if (!g) { g = { major: set.major, items: [] }; groups.push(g); }
      g.items.push({ set, i });
    });
    groups.forEach((g, gi) => {
      const total = g.items.reduce((a, it) => a + it.set.verses.length, 0);
      const head = document.createElement("button");
      head.className = "menu-group";
      head.innerHTML = '<span class="menu-major">' + g.major + '</span>' +
                       '<span class="menu-count">' + g.items.length + '묶음 · ' + total + '구절</span>' +
                       '<span class="menu-arrow">▾</span>';
      const list = document.createElement("div");
      list.className = "menu-sub" + (gi === 0 ? " open" : "");
      g.items.forEach(({ set, i }) => {
        const btn = document.createElement("button");
        btn.className = "menu-item";
        btn.innerHTML = '<span class="menu-minor">' + set.minor +
                        (set.minorEn ? ' <small>(' + set.minorEn + ')</small>' : '') + '</span>' +
                        '<span class="menu-count">' + set.verses.length + '구절</span>';
        btn.addEventListener("click", () => openSet(i));
        list.appendChild(btn);
      });
      head.addEventListener("click", () => {
        list.classList.toggle("open");
        head.classList.toggle("open", list.classList.contains("open"));
      });
      head.classList.toggle("open", gi === 0);
      $("menuList").appendChild(head);
      $("menuList").appendChild(list);
    });

    $("card").addEventListener("click", showNextWord);
    $("revealAll").addEventListener("click", () => { titleShown = true; shown = words(deck.verses[index]).length; render(); });
    $("prev").addEventListener("click", () => go(-1));
    $("next").addEventListener("click", () => go(1));
    $("home").addEventListener("click", showMenu);
    $("goWallet").addEventListener("click", openWallet);

    // 좌우 스와이프로도 이동
    let touchX = null;
    $("app").addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
    $("app").addEventListener("touchend", e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (dx < -60) go(1);
      else if (dx > 60) go(-1);
    });

    // 카카오톡 공유
    function shareMsg(text) {
      $("shareMsg").textContent = text;
      setTimeout(() => { $("shareMsg").textContent = ""; }, 2500);
    }

    async function share() {
      if (KAKAO_JS_KEY && window.Kakao) {
        if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
        Kakao.Share.sendDefault({
          objectType: "feed",
          content: {
            title: SITE_TITLE,
            description: SITE_DESC,
            imageUrl: SITE_IMAGE,
            link: { mobileWebUrl: SITE_URL, webUrl: SITE_URL }
          },
          buttons: [{ title: "암송 시작하기", link: { mobileWebUrl: SITE_URL, webUrl: SITE_URL } }]
        });
        return;
      }
      if (navigator.share) {
        try {
          await navigator.share({ url: SITE_URL });
        } catch (e) { /* 사용자가 취소함 */ }
        return;
      }
      try {
        await navigator.clipboard.writeText(SITE_URL);
        shareMsg("주소를 복사했어요. 카카오톡에 붙여넣기 하세요.");
      } catch (e) {
        shareMsg(SITE_URL);
      }
    }
    $("kakaoShare").addEventListener("click", share);

    showMenu();
  </script>
</body>
</html>
