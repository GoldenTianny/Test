  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; }
    body {
      background: #fff;
      color: #222;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      user-select: none;
    }

    /* 상단: 대주제 > 소주제 */
    .top {
      padding: 14px 16px 10px;
      border-bottom: 2px solid #333;
    }
    .top .major {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid #333;
      padding: 1px 7px;
      margin-bottom: 6px;
    }
    .top .minor {
      font-size: 17px;
      font-weight: 700;
    }
    .top .minor-en {
      font-size: 12px;
      color: #666;
      font-weight: 400;
      margin-left: 4px;
    }

    /* 카드 본문 */
    .card {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 16px;
      cursor: pointer;
    }
    .title-bar {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      background: #e6e6e6;
      border-top: 1px solid #333;
      border-bottom: 1px solid #333;
      padding: 7px 10px;
      margin: 14px 0 12px;
    }
    .title-bar .name { font-size: 15px; font-weight: 700; }
    .title-bar .ref  { font-size: 13px; font-weight: 700; }

    .lines {
      flex: 1;
      font-size: 18px;
      line-height: 2;
      padding: 0 4px;
      word-break: keep-all;
    }
    .word {
      display: inline-block;
      margin-right: .35em;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity .25s ease, transform .25s ease;
    }
    .word.show { opacity: 1; transform: none; }

    .hint {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      padding: 10px 0 4px;
    }
    .hint.hidden { visibility: hidden; }

    /* 하단 컨트롤 */
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 20px;
      border-top: 1px solid #ccc;
    }
    .nav {
      width: 46px; height: 46px;
      border: 1px solid #333;
      border-radius: 50%;
      background: #fff;
      font-size: 20px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .nav:disabled { opacity: .25; cursor: default; }
    .counter { font-size: 13px; color: #666; }
    .reveal {
      border: 1px solid #333;
      background: #fff;
      padding: 9px 16px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
    }
    .reveal:active, .nav:active { background: #eee; }
    .right { display: flex; align-items: center; gap: 10px; }

    .app { flex: 1; display: flex; flex-direction: column; }
    .top-row { display: flex; justify-content: space-between; align-items: center; }
    .home {
      border: 1px solid #333;
      background: #fff;
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .home:active { background: #eee; }

    /* 시작 메뉴 */
    .menu {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 32px 24px;
      overflow-y: auto;
    }
    .menu-group { margin-top: 10px; }
    .menu-title { font-size: 22px; font-weight: 700; letter-spacing: 2px; text-align: center; }
    .menu-sub { font-size: 13px; color: #777; text-align: center; margin: 6px 0 28px; }
    .menu-list { display: flex; flex-direction: column; gap: 8px; }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid #333;
      padding: 12px 14px;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      color: #222;
    }
    .menu-item:active { background: #eee; }
    .menu-major { font-size: 12px; font-weight: 700; border: 1px solid #333; padding: 1px 7px; }
    .menu-minor { font-size: 16px; font-weight: 700; }
    .menu-minor small { font-size: 12px; color: #666; font-weight: 400; }
    .menu-count { font-size: 12px; color: #777; white-space: nowrap; }
    .kakao {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 28px auto 0;
      padding: 12px 22px;
      background: #FEE500;
      color: #191919;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .kakao:active { background: #f2d900; }
    .share-msg { text-align: center; font-size: 12px; color: #777; margin-top: 10px; min-height: 16px; }

    let setIndex = 0;
    let index = 0;
    let shown = 0;

    const $ = id => document.getElementById(id);
    const words = v => v.text.split(/\s+/);
    const current = () => SETS[setIndex];

    function showMenu() {
      $("menu").style.display = "flex";
      $("app").style.display = "none";
    }

    function openSet(i) {
      setIndex = i;
      index = 0;
      shown = 0;
      $("menu").style.display = "none";
      $("app").style.display = "flex";
      render();
    }

    function render() {
      const set = current();
      const v = set.verses[index];
      $("major").textContent = set.major;
      $("minor").textContent = set.minor;
      $("minorEn").textContent = set.minorEn ? "(" + set.minorEn + ")" : "";
      $("name").textContent = v.name;
      $("ref").textContent = v.ref;
      $("counter").textContent = (index + 1) + " / " + set.verses.length;

      const box = $("lines");
      box.innerHTML = "";
      words(v).slice(0, shown).forEach(w => {
        const span = document.createElement("span");
        span.className = "word show";
        span.textContent = w;
        box.appendChild(span);
      });

      $("hint").classList.toggle("hidden", shown > 0);
      $("prev").disabled = index === 0;
      $("next").disabled = index === set.verses.length - 1;
      $("revealAll").disabled = shown >= words(v).length;
    }

    function showNextWord() {
      if (shown < words(current().verses[index]).length) {
        shown++;
        render();
      }
    }

    function go(delta) {
      const n = index + delta;
      if (n < 0 || n >= current().verses.length) return;
      index = n;
      shown = 0;
      render();
    }

    // 메뉴 만들기 (같은 대주제끼리 묶어서 표시)
    let lastMajor = null;
    SETS.forEach((set, i) => {
      if (set.major !== lastMajor) {
        const head = document.createElement("div");
        head.className = "menu-group";
        head.innerHTML = '<span class="menu-major">' + set.major + '</span>';
        $("menuList").appendChild(head);
        lastMajor = set.major;
      }
      const btn = document.createElement("button");
      btn.className = "menu-item";
      btn.innerHTML = '<span class="menu-minor">' + set.minor + ' <small>(' + set.minorEn + ')</small></span>' +
                      '<span class="menu-count">' + set.verses.length + '구절</span>';
      btn.addEventListener("click", () => openSet(i));
      $("menuList").appendChild(btn);
    });

    $("card").addEventListener("click", showNextWord);
    $("revealAll").addEventListener("click", () => { shown = words(current().verses[index]).length; render(); });
    $("prev").addEventListener("click", () => go(-1));
    $("next").addEventListener("click", () => go(1));
    $("home").addEventListener("click", showMenu);

    // 좌우 스와이프로도 이동
    let touchX = null;
    $("app").addEventListener("touchstart", e => { touchX = e.touches[0].clientX; }, { passive: true });
    $("app").addEventListener("touchend", e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (dx < -60) go(1);
      else if (dx > 60) go(-1);
    });

    // 카카오톡 공유
    function shareMsg(text) {
      $("shareMsg").textContent = text;
      setTimeout(() => { $("shareMsg").textContent = ""; }, 2500);
    }

    async function share() {
      if (KAKAO_JS_KEY && window.Kakao) {
        if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY);
        Kakao.Share.sendDefault({
          objectType: "feed",
          content: {
            title: SITE_TITLE,
            description: SITE_DESC,
            imageUrl: SITE_IMAGE,
            link: { mobileWebUrl: SITE_URL, webUrl: SITE_URL }
          },
          buttons: [{ title: "암송 시작하기", link: { mobileWebUrl: SITE_URL, webUrl: SITE_URL } }]
        });
        return;
      }
      if (navigator.share) {
        try {
          await navigator.share({ title: SITE_TITLE, text: SITE_DESC, url: SITE_URL });
        } catch (e) { /* 사용자가 취소함 */ }
        return;
      }
      try {
        await navigator.clipboard.writeText(SITE_URL);
        shareMsg("주소를 복사했어요. 카카오톡에 붙여넣기 하세요.");
      } catch (e) {
        shareMsg(SITE_URL);
      }
    }
    $("kakaoShare").addEventListener("click", share);

    showMenu();
  </script>
