<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>솔져팀</title>
  <meta name="description" content="솔져팀 함께 기도해요">
  <meta property="og:type" content="website">
  <meta property="og:title" content="솔져팀">
  <meta property="og:description" content="🙏 함께 기도해요">
  <meta property="og:image" content="https://goldentianny.github.io/Test/soldier_a/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://goldentianny.github.io/Test/soldier_a/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-title" content="솔져팀">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; }
    body {
      background: #fff; color: #222;
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      max-width: 640px; margin: 0 auto; padding: 0 16px 60px;
    }
    .hide { display: none !important; }
    button {
      font-family: inherit; cursor: pointer; border: 1px solid #333; background: #fff; color: #222;
      border-radius: 6px; padding: 8px 14px; font-size: 14px; font-weight: 700;
    }
    button.primary { background: #333; color: #fff; }
    button:disabled { opacity: .4; cursor: default; }
    input, textarea, select {
      width: 100%; font-family: inherit; font-size: 15px; padding: 10px; border: 1px solid #333; border-radius: 6px; background: #fff;
    }

    /* 로그인 */
    .login { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
    .login h1 { font-size: 24px; letter-spacing: 1px; margin: 0; }
    .login p { color: #777; font-size: 14px; margin: 0 0 10px; }
    .login input { font-size: 16px; padding: 12px; }
    .err { color: #d33; font-size: 13px; min-height: 18px; word-break: break-all; }

    header { padding: 22px 0 10px; border-bottom: 2px solid #333; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    header h1 { font-size: 18px; margin: 0; line-height: 1.4; }
    header .btns { display: flex; gap: 6px; flex-shrink: 0; }
    header button { font-size: 12px; padding: 5px 10px; }
    .admin-badge { display: none; font-size: 11px; vertical-align: middle; background: #d33; color: #fff; padding: 2px 8px; border-radius: 10px; margin-left: 4px; }
    body.admin .admin-badge { display: inline-block; }

    /* 홈 메뉴 */
    .menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 20px 0; }
    .menu-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      aspect-ratio: 1 / 1; border: 2px solid #333; border-radius: 12px; background: #fff;
      font-size: 17px; font-weight: 700;
    }
    .menu-btn span { font-size: 36px; }
    .menu-btn:active { background: #f3f3f3; }
    .menu-btn.soon { border-style: dashed; border-color: #bbb; color: #bbb; cursor: default; font-weight: 400; font-size: 14px; }

    /* 타임라인 */
    .tl { position: relative; padding: 18px 0 10px 26px; }
    .tl::before { content: ""; position: absolute; left: 8px; top: 24px; bottom: 20px; width: 2px; background: #333; }
    .tl-item { position: relative; margin-bottom: 18px; cursor: pointer; }
    .tl-item::before {
      content: ""; position: absolute; left: -24px; top: 6px; width: 14px; height: 14px;
      border-radius: 50%; background: #fff; border: 2px solid #333;
    }
    .tl-item.now::before { background: #333; box-shadow: 0 0 0 4px #e6e6e6; }
    .tl-label { font-size: 13px; font-weight: 700; color: #555; margin-bottom: 6px; }
    .tl-item:not(.now) .tl-label::after { content: "🔒"; margin-left: 4px; font-size: 11px; }
    body.admin .tl-item:not(.now) .tl-label::after { content: ""; }
    .tl-item.now .tl-label::after { content: "지금"; margin-left: 6px; font-size: 11px; background: #333; color: #fff; padding: 1px 7px; border-radius: 10px; }
    .tl-card { border: 1px solid #333; border-radius: 8px; padding: 12px 14px; background: #fff; }
    .tl-card:active { background: #f3f3f3; }
    .tl-title { font-size: 16px; font-weight: 700; line-height: 1.4; }
    .tl-verse { font-size: 13px; color: #666; line-height: 1.6; margin-top: 6px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tl-meta { font-size: 12px; color: #999; margin-top: 8px; }
    .empty { color: #999; font-size: 14px; text-align: center; padding: 40px 0; }

    /* 기간 상세 */
    .period-label { font-size: 13px; font-weight: 700; color: #555; padding-top: 14px; }
    .readonly { font-size: 12px; color: #888; margin-top: 4px; }
    .verse { font-size: 14px; color: #555; line-height: 1.7; padding: 10px 2px 12px; border-bottom: 1px solid #ddd; white-space: pre-wrap; }
    .tabs { display: flex; margin-top: 12px; border: 1px solid #333; border-radius: 8px; overflow: hidden; }
    .tabs button { flex: 1; border: none; border-radius: 0; padding: 10px 0; font-size: 14px; }
    .tabs button + button { border-left: 1px solid #333; }
    .tabs button.on { background: #333; color: #fff; }
    .jump { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0 4px; }
    .jump button { font-size: 13px; padding: 5px 10px; font-weight: 400; }
    .team-head { font-size: 15px; font-weight: 700; margin: 26px 0 -6px; padding-bottom: 6px; border-bottom: 2px solid #333; }
    .person { margin-top: 18px; scroll-margin-top: 10px; }
    .person.common .p-head { background: #fff7e0; }
    .p-head {
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
      background: #e6e6e6; border-top: 1px solid #333; border-bottom: 1px solid #333; padding: 8px 10px;
    }
    .p-head b { font-size: 16px; }
    .p-head small { color: #777; font-size: 11px; margin-left: 6px; font-weight: 400; }
    .p-head .acts { display: flex; gap: 6px; }
    .p-head button { font-size: 12px; padding: 4px 10px; }
    .p-head button.del { border-color: #d33; color: #d33; }
    .p-text { white-space: pre-wrap; font-size: 15px; line-height: 1.75; padding: 10px 4px; }
    .p-text:empty::before { content: "아직 입력된 기도제목이 없어요."; color: #aaa; }
    .person textarea { min-height: 70vh; line-height: 1.7; margin-top: 8px; font-size: 15px; resize: vertical; }
    .edit-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .chip { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; margin-left: 6px; vertical-align: middle; }
    .chip.ok { background: #2a7; color: #fff; }
    .chip.wait { background: #fff; color: #c80; border: 1px solid #e0b040; }
    .p-head button.confirm { background: #2a7; border-color: #2a7; color: #fff; }
    .p-head button.unconfirm { font-weight: 400; color: #777; border-color: #bbb; }
    .progress { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: #555; }
    .progress .bar { flex: 1; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; }
    .progress .bar i { display: block; height: 100%; background: #2a7; width: 0; transition: width .3s; }
    .progress label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
    .progress input { width: auto; }
    .jump button.done::before { content: "✓ "; color: #2a7; font-weight: 700; }
    .add-person { width: 100%; margin-top: 22px; border-style: dashed; }
    .status { text-align: center; color: #777; font-size: 14px; padding: 40px 0; }

    /* 폼 */
    .form { display: flex; flex-direction: column; gap: 12px; padding: 16px 0; }
    .form label { font-size: 13px; font-weight: 700; color: #555; display: flex; flex-direction: column; gap: 6px; }
    .form textarea { min-height: 120px; line-height: 1.6; }
    .form .row { display: flex; gap: 8px; }
    .form .row > * { flex: 1; }
    .form .note { font-size: 12px; color: #888; }
    .form .check-row { flex-direction: row; align-items: center; gap: 8px; font-weight: 400; color: #222; font-size: 14px; }
    .form .check-row input { width: auto; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: #333; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px;
      opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center;
    }
    .toast.show { opacity: 1; }

    /* PDF(인쇄용) 화면 */
    .pv { position: fixed; inset: 0; background: #f2f2f2; overflow-y: auto; z-index: 20; padding: 0 0 40px; }
    .pv-bar { position: sticky; top: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px;
      background: #fff; border-bottom: 2px solid #333; padding: 10px 12px; font-size: 13px; font-weight: 700; z-index: 1; }
    .pv-bar span { display: flex; gap: 6px; align-items: center; }
    .pv-bar button { font-size: 12px; padding: 6px 10px; }
    .pv-bar button.on { background: #333; color: #fff; }
    .pv-tip { font-size: 12px; color: #666; text-align: center; padding: 8px 12px 0; }
    .doc {
      background: #fff; width: min(148mm, 100%); margin: 12px auto 0; padding: 18mm 15mm 16mm; box-shadow: 0 2px 10px rgba(0,0,0,.15);
      color: #000; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 11pt; line-height: 1.55;
    }
    .doc h1 { text-align: center; font-size: 20pt; line-height: 1.3; margin: 0 0 10px; letter-spacing: .3px; word-break: keep-all; }
    .doc .d-verse { margin: 0 0 12px; }
    .doc .d-sec { margin: 0 0 12px; }
    .doc h2 { font-size: 13pt; margin: 0 0 3px; break-after: avoid-page; }
    .doc .d-num { padding-left: 1.6em; text-indent: -1.6em; }
    .doc .d-sub { padding-left: 2.4em; text-indent: -0.8em; }
    .doc .d-line { }
    .doc .d-ref { color: #333; }
    @page { size: 148mm 210mm; margin: 18mm 15mm 16mm; @bottom-center { content: "-" counter(page) "-"; font-size: 9pt; } }
    @media print {
      body > *:not(.pv) { display: none !important; }
      body { padding: 0; max-width: none; }
      .pv { position: static; background: #fff; overflow: visible; padding: 0; }
      .no-print { display: none !important; }
      .doc { width: auto; margin: 0; padding: 0; box-shadow: none; }
    }
  </style>
</head>
<body>

  <!-- 로그인 -->
  <section class="login" id="login">
    <h1>SOLDIER</h1>
    <p>팀 비밀번호(또는 관리자 비밀번호)를 입력하세요.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호">
    <button class="primary" id="enter">들어가기</button>
    <div class="err" id="err"></div>
  </section>

  <!-- 홈 메뉴 -->
  <section class="hide" id="home">
    <header>
      <h1>SOLDIER <span class="admin-badge">관리자</span></h1>
      <div class="btns"><button id="logout">나가기</button></div>
    </header>
    <div class="menu">
      <button class="menu-btn" id="goPrayers"><span>🙏</span>기도제목</button>
      <div class="menu-btn soon">준비 중</div>
    </div>
  </section>

  <!-- 타임라인 -->
  <section class="hide" id="timeline">
    <header>
      <h1>기도제목 <span class="admin-badge">관리자</span></h1>
      <div class="btns"><button id="newPeriodBtn">+ 새 기간</button><button id="tlHome">홈</button></div>
    </header>
    <div class="tl" id="tl"><div class="status">불러오는 중…</div></div>
  </section>

  <!-- 새 기간 / 기간 정보 수정 -->
  <section class="hide" id="periodForm">
    <header>
      <h1 id="formTitle">새 기간 만들기</h1>
      <div class="btns"><button id="formCancel">취소</button></div>
    </header>
    <div class="form">
      <div class="row" id="monthRow">
        <label>연도<input type="number" id="fYear" inputmode="numeric"></label>
        <label>시작 월<input type="number" id="fMonth" min="1" max="12" inputmode="numeric"></label>
      </div>
      <label>기간 이름<input id="fLabel" placeholder="예: 2026년 11–12월"></label>
      <label>제목<input id="fTitle" placeholder="예: 2026년 SOLDIER Team 11,12월 기도제목"></label>
      <label>말씀<textarea id="fVerse" placeholder="이번 기간의 말씀"></textarea></label>
      <label class="check-row" id="copyRow"><input type="checkbox" id="fCopy" checked> 지난 기간 기도제목 내용도 그대로 복사하기</label>
      <div class="note" id="formNote">지난 기간의 A·B팀 명단을 그대로 가져와요. 복사하지 않으면 내용은 비워 둬요.</div>
      <button class="primary" id="formSave">만들기</button>
    </div>
  </section>

  <!-- 기간 상세 -->
  <section class="hide" id="main">
    <header>
      <h1 id="title">기도제목</h1>
      <div class="btns"><button id="pdfBtn">PDF</button><button id="editPeriod">정보 수정</button><button id="backToTl">목록</button></div>
    </header>
    <div class="period-label" id="periodLabel"></div>
    <div class="readonly hide" id="readonlyNote">🔒 지난 기간이라 읽기만 할 수 있어요.</div>
    <div class="verse" id="verse"></div>
    <div class="tabs" id="tabs">
      <button data-team="A">A팀</button><button data-team="B">B팀</button>
    </div>
    <div class="progress" id="progress"><span id="progText"></span><span class="bar"><i id="progBar"></i></span><label><input type="checkbox" id="onlyWait"> 미확인만</label></div>
    <div class="jump" id="jump"></div>
    <div id="list"><div class="status">불러오는 중…</div></div>
    <button class="add-person hide" id="addPerson">+ 사람 추가 (관리자)</button>
  </section>

  <!-- PDF(인쇄용) 화면: 관리자 -->
  <div class="pv hide" id="pv">
    <div class="pv-bar no-print">
      <span>팀 <button data-t="A">A팀</button><button data-t="B">B팀</button></span>
      <span><button class="primary" id="pvPrint">PDF로 저장 / 인쇄</button><button id="pvClose">닫기</button></span>
    </div>
    <div class="pv-tip no-print">「PDF로 저장 / 인쇄」 → 프린터 대신 <b>PDF로 저장</b>을 고르면 파일로 저장돼요.</div>
    <article class="doc" id="doc"></article>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // Supabase 프로젝트 주소와 공개 키. 공개 키라도 비밀번호 없이는 아무것도 읽거나 쓸 수 없어요.
    const SUPABASE_URL = "https://rkrzgrdeqyvuwdbhiumz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qp-wPae73D9GOC7TZ31Bnw_iHYuHs1G";

    const PW_KEY = "soldier_a.pw", TAB_KEY = "soldier.tab";
    const $ = id => document.getElementById(id);
    const store = {
      get: k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
      set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
    };
    let pw = store.get(PW_KEY);
    let periods = [];
    let current = null;            // 지금 열려 있는 기간
    let isAdmin = false;           // 관리자 비밀번호로 들어왔는지
    let tab = store.get(TAB_KEY) === "B" ? "B" : "A";

    function toast(msg) {
      $("toast").textContent = msg; $("toast").classList.add("show");
      setTimeout(() => $("toast").classList.remove("show"), 2600);
    }
    const md = iso => { if (!iso) return ""; const d = new Date(iso); return (d.getMonth() + 1) + "/" + d.getDate(); };

    async function rpc(fn, args) {
      const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/" + fn, {
        method: "POST",
        // 새 형식 키(sb_publishable_…)는 apikey 헤더만, 예전 anon 키(eyJ…)는 Authorization 도 함께 보내요.
        headers: Object.assign({ "Content-Type": "application/json", apikey: SUPABASE_KEY },
          SUPABASE_KEY.startsWith("sb_") ? {} : { Authorization: "Bearer " + SUPABASE_KEY }),
        body: JSON.stringify(Object.assign({ pw }, args || {}))
      });
      if (!r.ok) {
        let detail = "";
        try { const j = await r.json(); detail = j.message || j.msg || j.error || JSON.stringify(j); } catch (e) {}
        throw new Error("HTTP " + r.status + (detail ? " · " + detail : ""));
      }
      return r.json();
    }

    // ---------- 화면 전환 (휴대폰 뒤로가기도 동작) ----------
    const SECTIONS = ["login", "home", "timeline", "periodForm", "main"];
    function show(id) { SECTIONS.forEach(k => $(k).classList.toggle("hide", k !== id)); window.scrollTo(0, 0); }
    function go(state, replace) {
      try { history[replace ? "replaceState" : "pushState"](state, ""); } catch (e) {}
      route(state);
    }
    function route(state) {
      if (!state || state.v === "home") return show("home");
      if (state.v === "timeline") return showTimeline(true);
      if (state.v === "period") return openPeriod(state.id);
      if (state.v === "form") return showForm(state.id);
    }
    window.addEventListener("popstate", e => { if (pw && $("login").classList.contains("hide")) route(e.state); });

    // ---------- 로그인 ----------
    async function enter() {
      $("enter").disabled = true; $("enter").textContent = "확인 중…";
      let res = null, why = "";
      try { res = await rpc("list_periods"); } catch (e) { why = e.message; }
      $("enter").disabled = false; $("enter").textContent = "들어가기";
      if (!res) { showLogin("불러오지 못했어요. (" + why + ")"); return; }
      if (!res.ok) { store.set(PW_KEY, ""); showLogin(pw ? "비밀번호가 맞지 않아요." : ""); return; }
      store.set(PW_KEY, pw);
      periods = res.periods || [];
      isAdmin = !!res.admin;
      document.body.classList.toggle("admin", isAdmin);
      go({ v: "home" }, true);
    }
    function showLogin(msg) { show("login"); $("err").textContent = msg || ""; }

    // ---------- 타임라인 ----------
    async function showTimeline(refresh) {
      show("timeline");
      if (refresh) { try { const res = await rpc("list_periods"); if (res.ok) periods = res.periods || []; } catch (e) {} }
      const tl = $("tl");
      tl.innerHTML = "";
      if (!periods.length) { tl.innerHTML = '<div class="empty">아직 기간이 없어요. 「+ 새 기간」으로 만들어 주세요.</div>'; return; }
      periods.forEach((p, i) => {
        const it = document.createElement("div");
        it.className = "tl-item" + (i === 0 ? " now" : "");
        it.innerHTML = '<div class="tl-label"></div><div class="tl-card"><div class="tl-title"></div><div class="tl-verse"></div><div class="tl-meta"></div></div>';
        it.querySelector(".tl-label").textContent = p.label;
        it.querySelector(".tl-title").textContent = p.title || "(제목 없음)";
        it.querySelector(".tl-verse").textContent = p.verse || "";
        it.querySelector(".tl-meta").textContent = p.count + "명" + (p.confirmed != null ? " · 확인 " + p.confirmed + "/" + p.count : "") + (p.updated ? " · 최근 수정 " + md(p.updated) : "");
        it.addEventListener("click", () => go({ v: "period", id: p.id }));
        tl.appendChild(it);
      });
    }

    // ---------- 기간 상세 ----------
    async function openPeriod(id) {
      show("main");
      $("list").innerHTML = '<div class="status">불러오는 중…</div>';
      $("jump").innerHTML = ""; $("title").textContent = ""; $("verse").textContent = ""; $("periodLabel").textContent = "";
      let res = null;
      try { res = await rpc("get_period", { pid: id }); } catch (e) {}
      if (!res || !res.ok) { $("list").innerHTML = '<div class="status">불러오지 못했어요.</div>'; return; }
      current = res;
      const editable = res.editable !== false;
      $("editPeriod").classList.toggle("hide", !editable);
      $("readonlyNote").classList.toggle("hide", editable);
      $("addPerson").classList.toggle("hide", !isAdmin);
      $("periodLabel").textContent = res.label;
      $("title").textContent = res.title || "기도제목";
      $("verse").textContent = res.verse || "";
      render();
    }

    const isGroup = p => p.team === "C" || /전체$/.test(p.name);   // 공통 기도제목
    let onlyWait = false;

    function updateProgress() {
      const ppl = current.people.filter(p => !isGroup(p) && p.team === tab);
      const done = ppl.filter(p => p.confirmed).length;
      $("progText").textContent = "확인 " + done + " / " + ppl.length + "명";
      $("progBar").style.width = (ppl.length ? Math.round(done / ppl.length * 100) : 0) + "%";
    }

    function headHtml(box, p) {
      box.querySelector("small").textContent = p.updated ? md(p.updated) + " 수정" : "";
      const chip = box.querySelector(".chip");
      if (isGroup(p)) { chip.className = "chip hide"; return; }
      chip.className = "chip " + (p.confirmed ? "ok" : "wait");
      chip.textContent = p.confirmed ? "✓ 확인 " + md(p.confirmed) : "미확인";
    }

    function render() {
      [...$("tabs").children].forEach(b => b.classList.toggle("on", b.dataset.team === tab));
      const list = $("list"), jump = $("jump");
      list.innerHTML = ""; jump.innerHTML = "";
      const editable = current.editable !== false;
      updateProgress();
      // 공통 기도제목은 어느 탭에서나 맨 위에, 그다음 팀별
      ["C", tab].filter(t => t !== "C" || !onlyWait).forEach(t => {
        const people = current.people.filter(p => p.team === t && !(onlyWait && (p.confirmed || isGroup(p))));
        people.forEach(p => {
          const id = "p-" + encodeURIComponent(p.name);
          const j = document.createElement("button");
          j.textContent = p.name;
          if (p.confirmed) j.classList.add("done");
          j.addEventListener("click", () => $(id).scrollIntoView({ behavior: "smooth" }));
          jump.appendChild(j);

          const box = document.createElement("div");
          box.className = "person" + (p.team === "C" ? " common" : ""); box.id = id;
          box.innerHTML = '<div class="p-head"><span><b></b><span class="chip"></span><small></small></span><span class="acts"></span></div><div class="p-text"></div>';
          box.querySelector("b").textContent = p.name;
          box.querySelector(".p-text").textContent = p.text;
          headHtml(box, p);
          const acts = box.querySelector(".acts");
          if (editable) {
            const e = document.createElement("button"); e.textContent = "수정";
            e.addEventListener("click", () => edit(box, p));
            acts.appendChild(e);
            if (!isGroup(p)) {
              const c = document.createElement("button");
              const paint = () => { c.textContent = p.confirmed ? "확인 취소" : "확인"; c.className = p.confirmed ? "unconfirm" : "confirm"; };
              paint();
              c.addEventListener("click", () => confirmPrayer(p, !p.confirmed, box, paint));
              acts.appendChild(c);
            }
          }
          if (isAdmin && !isGroup(p)) {
            const d = document.createElement("button"); d.textContent = "빼기"; d.className = "del";
            d.addEventListener("click", () => removePerson(p));
            acts.appendChild(d);
          }
          list.appendChild(box);
        });
      });
      if (!list.children.length) list.innerHTML = '<div class="status">' + (onlyWait ? "모두 확인했어요 🎉" : "아직 사람이 없어요.") + '</div>';
    }

    async function confirmPrayer(p, on, box, paint) {
      let res = null, why = "";
      try { res = await rpc("confirm_prayer", { pid: current.id, p_name: p.name, p_on: on }); } catch (e) { why = e.message; }
      if (!res || !res.ok) {
        toast(res && res.error === "locked" ? "지난 기간은 수정할 수 없어요."
            : /404|confirm_prayer|function/i.test(why) ? "DB에 확인 기능이 아직 없어요 (확인 기능 SQL 실행 필요)"
            : "처리하지 못했어요. 다시 시도해 주세요.");
        return;
      }
      p.confirmed = res.confirmed;
      headHtml(box, p); paint(); updateProgress();
      const j = [...$("jump").children].find(b => b.textContent === p.name);
      if (j) j.classList.toggle("done", !!p.confirmed);
      toast(on ? p.name + " 님 확인 완료 ✓" : "확인을 취소했어요");
      if (onlyWait && on) setTimeout(render, 500);
    }

    function edit(box, p) {
      if (box.querySelector("textarea")) return;
      const text = box.querySelector(".p-text");
      text.classList.add("hide");
      const ta = document.createElement("textarea");
      ta.value = p.text;
      const acts = document.createElement("div");
      acts.className = "edit-actions";
      acts.innerHTML = '<button>취소</button><button class="primary">저장</button>';
      box.appendChild(ta); box.appendChild(acts);
      // 내용이 길면 그만큼 늘어나서 한눈에 많이 보이게
      const grow = () => { ta.style.height = "auto"; ta.style.height = Math.max(ta.scrollHeight + 4, window.innerHeight * 0.7) + "px"; };
      grow(); ta.addEventListener("input", grow);
      box.scrollIntoView({ behavior: "smooth", block: "start" });
      ta.focus({ preventScroll: true });
      const close = () => { ta.remove(); acts.remove(); text.classList.remove("hide"); };
      acts.children[0].addEventListener("click", close);
      acts.children[1].addEventListener("click", async () => {
        acts.children[1].disabled = true; acts.children[1].textContent = "저장 중…";
        let res = null;
        try { res = await rpc("save_prayer", { pid: current.id, p_name: p.name, p_text: ta.value }); } catch (e) {}
        if (res && res.ok) {
          const changed = p.text !== ta.value;
          p.text = ta.value; p.updated = res.updated;
          if (changed) p.confirmed = null;
          text.textContent = p.text;
          render();
          toast(changed && !isGroup(p) ? "저장했어요. 내용 확인 후 「확인」을 눌러 주세요" : "저장했어요");
        } else {
          acts.children[1].disabled = false; acts.children[1].textContent = "저장";
          toast(res && res.error === "locked" ? "지난 기간은 수정할 수 없어요." : "저장하지 못했어요. 다시 시도해 주세요.");
        }
      });
    }

    async function addPerson() {
      const name = (prompt("추가할 이름을 입력하세요") || "").trim();
      if (!name) return;
      const t = (prompt("팀을 입력하세요 (A 또는 B)", tab === "B" ? "B" : "A") || "").trim().toUpperCase();
      if (t !== "A" && t !== "B") { toast("팀은 A 또는 B로 입력해 주세요"); return; }
      let res = null;
      try { res = await rpc("add_person", { pid: current.id, p_name: name, p_team: t }); } catch (e) {}
      if (res && res.ok) { toast(name + " 님을 " + t + "팀에 추가했어요"); tab = t; store.set(TAB_KEY, tab); openPeriod(current.id); }
      else toast("추가하지 못했어요.");
    }

    async function removePerson(p) {
      if (!confirm(current.label + "에서 " + p.name + " 님을 뺄까요?\n(이 기간의 기도제목도 함께 지워져요)")) return;
      let res = null;
      try { res = await rpc("remove_person", { pid: current.id, p_name: p.name }); } catch (e) {}
      if (res && res.ok) { toast("뺐어요"); openPeriod(current.id); } else toast("빼지 못했어요.");
    }

    // ---------- 새 기간 / 기간 정보 수정 ----------
    function showForm(editId) {
      show("periodForm");
      const editing = editId && current && current.id === editId ? current : null;
      $("formTitle").textContent = editing ? "기간 정보 수정" : "새 기간 만들기";
      $("formSave").textContent = editing ? "저장" : "만들기";
      ["monthRow", "formNote", "copyRow"].forEach(k => $(k).classList.toggle("hide", !!editing));
      $("periodForm").dataset.edit = editing ? editing.id : "";
      if (editing) { $("fLabel").value = editing.label; $("fTitle").value = editing.title; $("fVerse").value = editing.verse; return; }
      const last = periods[0];
      let y = new Date().getFullYear(), m = new Date().getMonth() + 1;
      if (last && last.starts_on) { const d = new Date(last.starts_on); y = d.getFullYear(); m = d.getMonth() + 3; if (m > 12) { m -= 12; y++; } }
      $("fYear").value = y; $("fMonth").value = m;
      fillDefaults();
      $("fVerse").value = last ? (last.verse || "") : "";
    }
    function fillDefaults() {
      const y = +$("fYear").value, m = +$("fMonth").value;
      if (!y || !m) return;
      const m2 = m === 12 ? 1 : m + 1;
      $("fLabel").value = y + "년 " + m + "–" + m2 + "월";
      $("fTitle").value = y + "년 SOLDIER Team " + m + "," + m2 + "월 기도제목";
    }
    $("fYear").addEventListener("input", fillDefaults);
    $("fMonth").addEventListener("input", fillDefaults);

    $("formSave").addEventListener("click", async () => {
      const label = $("fLabel").value.trim();
      if (!label) { toast("기간 이름을 입력해 주세요"); return; }
      const editId = +$("periodForm").dataset.edit || 0;
      $("formSave").disabled = true;
      let res = null;
      try {
        if (editId) res = await rpc("update_period", { pid: editId, p_label: label, p_title: $("fTitle").value, p_verse: $("fVerse").value });
        else {
          const y = +$("fYear").value, m = +$("fMonth").value;
          res = await rpc("create_period", { p_label: label, p_starts_on: y + "-" + String(m).padStart(2, "0") + "-01",
            p_title: $("fTitle").value, p_verse: $("fVerse").value, p_copy: $("fCopy").checked });
        }
      } catch (e) {}
      $("formSave").disabled = false;
      if (!res || !res.ok) { toast(res && res.error === "locked" ? "지난 기간은 수정할 수 없어요." : "저장하지 못했어요. 다시 시도해 주세요."); return; }
      toast(editId ? "저장했어요" : "새 기간을 만들었어요");
      try { const l = await rpc("list_periods"); if (l.ok) periods = l.periods || []; } catch (e) {}
      go({ v: "period", id: editId || res.id }, true);
    });

    // ---------- 버튼 ----------
    $("enter").addEventListener("click", () => { pw = $("pw").value.trim(); if (pw) enter(); });
    $("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("enter").click(); });
    $("logout").addEventListener("click", () => { store.set(PW_KEY, ""); pw = ""; isAdmin = false; document.body.classList.remove("admin"); $("pw").value = ""; showLogin(""); });
    $("goPrayers").addEventListener("click", () => go({ v: "timeline" }));
    $("tlHome").addEventListener("click", () => go({ v: "home" }));
    $("newPeriodBtn").addEventListener("click", () => go({ v: "form" }));
    $("editPeriod").addEventListener("click", () => go({ v: "form", id: current && current.id }));
    $("formCancel").addEventListener("click", () => history.back());
    $("backToTl").addEventListener("click", () => go({ v: "timeline" }));
    $("addPerson").addEventListener("click", addPerson);
    $("onlyWait").addEventListener("change", e => { onlyWait = e.target.checked; render(); });
    $("tabs").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      tab = b.dataset.team; store.set(TAB_KEY, tab); render();
    });
    // ---------- PDF(인쇄용) 만들기: 관리자 ----------
    const esc = t => String(t).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    function bodyHtml(text) {
      return (text || "").split("\n").map(l => l.trim()).filter(Boolean).map(l => {
        if (/^\(?\d+[.)]\s*/.test(l)) return '<div class="d-num">' + esc(l) + '</div>';
        if (/^-/.test(l)) return '<div class="d-sub">' + esc(l) + '</div>';
        return '<div class="d-line">' + esc(l) + '</div>';
      }).join("");
    }
    function teamTitle(title, t) {
      if (/SOLDIER(-[AB])?\s*Team/i.test(title)) return title.replace(/SOLDIER(-[AB])?\s*Team/i, "SOLDIER-" + t + " Team");
      if (/SOLDIER(-[AB])?/i.test(title)) return title.replace(/SOLDIER(-[AB])?/i, "SOLDIER-" + t);
      return "SOLDIER-" + t + " " + title;
    }
    function buildDoc(t) {
      [...document.querySelectorAll(".pv-bar button[data-t]")].forEach(b => b.classList.toggle("on", b.dataset.t === t));
      const common = current.people.find(p => p.team === "C");
      const ppl = current.people.filter(p => p.team === t);
      let h = '<h1>' + esc(teamTitle(current.title || "", t)).replace(/(Team)\s+/, "$1<br>") + '</h1>';
      if (current.verse) h += '<div class="d-verse">' + esc(current.verse) + '</div>';
      if (common && common.text) h += '<section class="d-sec"><h2>전체</h2>' + bodyHtml(common.text) + '</section>';
      ppl.forEach(p => {
        // 첫 줄이 "(말씀)" 이면 이름 옆으로 올려요 (원래 문서 모양처럼)
        let text = p.text || "", ref = "";
        const m = text.match(/^\(([^)\n]+)\)\s*\n?/);
        if (m) { ref = "(" + m[1] + ")"; text = text.slice(m[0].length); }
        h += '<section class="d-sec"><h2>' + esc(p.name) + (ref ? '<span class="d-ref">' + esc(ref) + '</span>' : '') + '</h2>' + bodyHtml(text) + '</section>';
      });
      $("doc").innerHTML = h;
      document.title = teamTitle(current.title || "기도제목", t);
    }
    function openPdf() { buildDoc(tab === "B" ? "B" : "A"); $("pv").classList.remove("hide"); $("pv").scrollTop = 0; }
    function closePdf() { $("pv").classList.add("hide"); document.title = "솔져팀"; }
    $("pdfBtn").addEventListener("click", openPdf);
    $("pvClose").addEventListener("click", closePdf);
    $("pvPrint").addEventListener("click", () => window.print());
    document.querySelector(".pv-bar").addEventListener("click", e => { const b = e.target.closest("button[data-t]"); if (b) buildDoc(b.dataset.t); });

    if (pw) enter(); else showLogin("");
  </script>
</body>
</html>
